<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0A0A0A"/>
  <!-- Outer gold ring -->
  <circle cx="90" cy="90" r="78" stroke="#D4AF37" stroke-width="2.5" fill="none"/>
  <!-- Inner gold ring (thin) -->
  <circle cx="90" cy="90" r="71" stroke="#D4AF37" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Cloche dome -->
  <path d="M50 95 Q50 62 90 58 Q130 62 130 95 Z" fill="#D4AF37"/>
  <!-- Cloche base plate -->
  <rect x="44" y="95" width="92" height="7" rx="3.5" fill="#D4AF37"/>
  <!-- Plate line accent -->
  <rect x="50" y="104" width="80" height="1.5" rx="0.75" fill="#D4AF37" opacity="0.5"/>
  <!-- Knob -->
  <circle cx="90" cy="60" r="5.5" fill="#D4AF37"/>
  <rect x="87.5" y="52" width="5" height="8" rx="2.5" fill="#D4AF37"/>
  <!-- Fork (left) -->
  <line x1="62" y1="108" x2="62" y2="132" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="58" y1="108" x2="58" y2="120" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="66" y1="108" x2="66" y2="120" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Knife (right) -->
  <line x1="118" y1="108" x2="118" y2="132" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M118 108 L122 114 L118 118" stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Steam lines -->
  <path d="M82 52 Q80 46 82 40" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M90 50 Q88 44 90 38" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M98 52 Q96 46 98 40" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- F wordmark -->
  <text x="90" y="87" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="22" fill="#0A0A0A" font-weight="bold" letter-spacing="1">F</text>
</svg>
